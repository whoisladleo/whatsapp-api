name: Docker Publish

# Publishes images only for green master builds (#85): this workflow runs
# when the "Tests" workflow completes on master, and skips unless it
# succeeded. Manual dispatch always runs (re-ships current master — used
# for pipeline proving and for re-deploying without a code push).
on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: whoisladleo/whatsapp-api
            dockerfile: ./Dockerfile.prod
          # Same codebase/image as the API — Dockerfile.prod's default CMD
          # (./scripts/run.sh) starts the web server. Published under this
          # separate tag purely so Coolify can deploy it as its own resource
          # with the start command overridden to:
          #   celery -A app.core.celery_app worker --loglevel=info
          # (matches docker-compose.prod.yml's celery_worker service).
          - image: whoisladleo/whatsapp-api-celery
            dockerfile: ./Dockerfile.prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # On workflow_run, build the exact commit Tests just passed —
          # not whatever master points at when this job starts.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify redeploys
        run: |
          set -euo pipefail
          for var in COOLIFY_API_DEPLOY_WEBHOOK COOLIFY_WORKER_DEPLOY_WEBHOOK; do
            echo "Deploying ${var} ..."
            resp=$(curl -fsS -X POST "${!var}" \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}")
            echo "${resp}"
          done
        env:
          COOLIFY_API_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_API_DEPLOY_WEBHOOK }}
          COOLIFY_WORKER_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_WORKER_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
