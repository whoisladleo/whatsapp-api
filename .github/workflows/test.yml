name: Tests

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

  migrations:
    # pytest builds its schema with create_all and never runs a migration,
    # so a migration chain that can't build an empty database (#43) would
    # otherwise only surface on a brand-new environment.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQLALCHEMY_DATABASE_URI: postgresql://postgres:postgres@localhost:5432/postgres
      # alembic/env.py constructs Settings at import and Settings refuses to
      # boot without a real SECRET_KEY — migrations never touch JWT, so any
      # non-placeholder value satisfies the fail-fast check.
      SECRET_KEY: ci-migrations-dummy-key
      # Same story for the stored-token encryption key: any *valid* Fernet
      # value passes (this one is 32 zero bytes — insecure, test-only).
      TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Upgrade an empty database to head
        run: alembic upgrade head

      - name: Round-trip the newest migration
        run: alembic downgrade -1 && alembic upgrade head
