services:
  api:
    build: .
    volumes:
      - .:/app
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8000}
    # depends_on:
    #   db:
    #     condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'curl -fs http://127.0.0.1:${PORT:-8000}/health || exit 1'" ]
      interval: 30s
      timeout: 10s
      retries: 3

