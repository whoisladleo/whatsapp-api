services:
  api:
    image: whoisladleo/whatsapp:latest
    restart: always
    ports:
      - "${PORT:-8001}:${PORT:-8001}"
    environment:
      - PORT=${PORT:-8001}
      - POSTGRES_SERVER=${POSTGRES_SERVER:-db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - RUN_MODE=production
      - PROJECT_NAME=${PROJECT_NAME:-WhatsApp Medium}
      - SECRET_KEY=${SECRET_KEY:-generate_a_very_secure_random_string_here}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      # Fernet key for stored-token encryption (finding 9) — required at boot
      # and at migrate time. Generate once, back up with the DB credentials.
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - PHONE_NUMBER_ID=${PHONE_NUMBER_ID}
      - WEBHOOK_VERIFY_TOKEN=${WEBHOOK_VERIFY_TOKEN}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_POOL_ACCESS_TOKEN=${WHATSAPP_POOL_ACCESS_TOKEN}
      - WHATSAPP_REMINDER_TEMPLATE_NAME=${WHATSAPP_REMINDER_TEMPLATE_NAME:-hello_world}
      # The api service dispatches Celery tasks directly (webhook_processing,
      # location_capture, order/handoff reminder scheduling) — without this,
      # celery_app.py falls back to localhost:6379, which doesn't exist in
      # this container (Redis is the separate `redis` service below).
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TUNZAA_API_KEY=${TUNZAA_API_KEY}
      - TUNZAA_SECRET_KEY=${TUNZAA_SECRET_KEY}
      - TUNZAA_ENVIRONMENT=${TUNZAA_ENVIRONMENT:-sandbox}
      - WORKERS_PER_CORE=${WORKERS_PER_CORE:-1}
      - MAX_WORKERS=${MAX_WORKERS:-4}
      - TIMEOUT=${TIMEOUT:-120}
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'curl -fs http://127.0.0.1:${PORT:-8001}/health || exit 1'" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"

  redis:
    image: redis:7-alpine
    # No ports mapping: api/worker reach Redis over the internal compose
    # network (redis://redis:6379/0). Publishing 6379 exposed a
    # passwordless Redis to the host/network (#156).

  celery_worker:
    image: whoisladleo/whatsapp:latest
    restart: always
    environment:
      - POSTGRES_SERVER=${POSTGRES_SERVER:-db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - RUN_MODE=production
      - PROJECT_NAME=${PROJECT_NAME:-WhatsApp Medium}
      - SECRET_KEY=${SECRET_KEY:-generate_a_very_secure_random_string_here}
      # Worker decrypts stored tokens on every send — same key as api, or it
      # fails the boot check.
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - PHONE_NUMBER_ID=${PHONE_NUMBER_ID}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # AI/merchant message processing (app/tasks/webhook_processing.py) and
      # order-completion Tunzaa dispatch (app/services/llm.py) both run in
      # this worker process, not the api service — it needs the same
      # ANTHROPIC_API_KEY/Tunzaa credentials the api service has, or the AI
      # sales path silently no-ops (llm_service is None without a key).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - WHATSAPP_REMINDER_TEMPLATE_NAME=${WHATSAPP_REMINDER_TEMPLATE_NAME:-hello_world}
      - TUNZAA_API_KEY=${TUNZAA_API_KEY}
      - TUNZAA_SECRET_KEY=${TUNZAA_SECRET_KEY}
      - TUNZAA_ENVIRONMENT=${TUNZAA_ENVIRONMENT:-sandbox}
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10mb"
        max-file: "3"
        